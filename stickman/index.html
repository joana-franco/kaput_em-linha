<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kaput! em linha - Stickmans</title>

    <style>
            body {
              font-family: Inter, Arial, sans-serif;
              text-align: center;
              display: flex;
              gap: 20px;
            }

            canvas {
              border: 1px solid black;
              cursor: crosshair;
            }

            .controls {
              margin: 20px;
              display: flex;
              justify-content: center;
              gap: 15px;
            }

            button {
              background: none;
              border: 1px solid black;
              padding: 5px 10px;
              cursor: pointer;
              border-radius: 100px;
            }

            button:hover {
              background: rgba(0, 0, 0, 0.2);
            }

            #gallery {
              height: 500px;
              overflow-y: scroll;
            }

            #gallery img {
              width: 100px;
              margin: 5px;
            }
    </style>
  </head>
  <body>
    <section class="canvas">
      <canvas id="canvas" width="500" height="500"></canvas>

      <div class="controls">
        <button onclick="clearCanvas()">Limpar</button>
        <button onclick="saveDrawing()">Guardar</button>
      </div>
    </section>

    <div id="gallery">
    </div>

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
